<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#185FA5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bandeirante">
<title>Bandeirante — Carregadores Frontais</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/tabler-icons.min.css">
<style>
:root{
  --bg:#f8f9fa;--bg2:#fff;--border:#e2e6ea;--border2:#dee2e6;
  --text:#1a1a2e;--text2:#6c757d;--text3:#adb5bd;
  --blue:#185FA5;--blue-light:#E6F1FB;--blue-dark:#0C447C;
  --green:#27500A;--green-light:#EAF3DE;
  --orange:#633806;--orange-light:#FAEEDA;
  --red:#712B13;--red-light:#FAECE7;
  --radius:10px;--radius-sm:6px;--radius-lg:14px;
  --shadow:0 1px 3px rgba(0,0,0,.08);
  --shadow-md:0 4px 6px rgba(0,0,0,.07);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5}
input,select,textarea{font-family:inherit;font-size:14px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px;width:100%;outline:none;background:var(--bg2);color:var(--text);transition:border .15s}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(24,95,165,.12)}
textarea{resize:vertical;min-height:70px}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;border:1px solid var(--border);background:var(--bg2);color:var(--text);transition:all .15s}
.btn:hover{background:var(--bg)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-primary:hover{background:var(--blue-dark)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-danger{color:#dc3545;border-color:#f5c6cb}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-icon{padding:8px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.1rem 1.25rem;box-shadow:var(--shadow)}
.divider{border:none;border-top:1px solid var(--border);margin:.9rem 0}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px}
.badge-green{background:var(--green-light);color:var(--green)}
.badge-blue{background:var(--blue-light);color:var(--blue-dark)}
.badge-orange{background:var(--orange-light);color:var(--orange)}
.badge-gray{background:#f1f3f5;color:var(--text2)}
.ig{margin-bottom:.85rem}
.ig label{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1a1a2e;color:#fff;padding:11px 20px;border-radius:var(--radius);font-size:13px;font-weight:500;z-index:9999;opacity:0;transition:all .3s;white-space:nowrap;box-shadow:var(--shadow-md)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;padding:3rem 1rem;color:var(--text2)}
.empty i{font-size:36px;display:block;margin-bottom:.75rem;opacity:.3}
.app-header{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 1rem;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.app-logo{display:flex;align-items:center;gap:10px}
.app-logo-icon{width:34px;height:34px;background:var(--blue);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--border);display:flex;z-index:100}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px 10px;gap:3px;color:var(--text2);font-size:10px;font-weight:500;cursor:pointer;transition:color .15s;border:none;background:none}
.nav-item.active{color:var(--blue)}
.nav-item i{font-size:22px}
.page-wrap{padding:1rem;padding-bottom:80px;max-width:520px;margin:0 auto}
.progress-bar{display:flex;overflow-x:auto;border-bottom:1px solid var(--border);background:var(--bg2);padding:0 .5rem;scrollbar-width:none}
.progress-bar::-webkit-scrollbar{display:none}
.prog-step{display:flex;align-items:center;gap:5px;padding:10px 10px 10px 6px;font-size:11px;font-weight:500;white-space:nowrap;border-bottom:2px solid transparent;color:var(--text2);cursor:default}
.prog-step.done{color:var(--green);cursor:pointer}
.prog-step.active{color:var(--blue);border-bottom-color:var(--blue)}
.prog-dot{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;background:#f1f3f5;color:var(--text2)}
.prog-step.done .prog-dot{background:var(--green);color:#fff}
.prog-step.active .prog-dot{background:var(--blue);color:#fff}
.marca-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.marca-card{border:1.5px solid var(--border);border-radius:var(--radius);padding:.75rem .5rem;cursor:pointer;text-align:center;transition:all .15s;background:var(--bg2)}
.marca-card:active{transform:scale(.96)}
.marca-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 6px;font-size:13px;font-weight:700}
.modelo-item{border:1.5px solid var(--border);border-radius:var(--radius);padding:.7rem 1rem;cursor:pointer;margin-bottom:7px;transition:all .15s;background:var(--bg2)}
.car-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.car-card{border:1.5px solid var(--border);border-radius:var(--radius);padding:.9rem .75rem;cursor:pointer;transition:all .15s;background:var(--bg2)}
.item-row{display:flex;align-items:center;gap:10px;border:1.5px solid var(--border);border-radius:var(--radius);padding:.7rem .9rem;cursor:pointer;margin-bottom:8px;transition:all .15s;background:var(--bg2)}
.item-row.sel{border-color:var(--blue);background:var(--blue-light)}
.item-thumb{object-fit:contain;border-radius:var(--radius-sm);background:transparent;padding:4px;flex-shrink:0}
.item-thumb-ph{border-radius:var(--radius-sm);background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cli-card{border:1px solid var(--border);border-radius:var(--radius-lg);padding:.9rem 1rem;margin-bottom:8px;cursor:pointer;background:var(--bg2);transition:all .15s;box-shadow:var(--shadow)}
.cli-avatar{width:40px;height:40px;border-radius:50%;background:var(--blue-light);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--blue-dark);flex-shrink:0}
.orc-card{border:1px solid var(--border);border-radius:var(--radius);padding:.8rem 1rem;margin-bottom:8px;background:var(--bg2);box-shadow:var(--shadow)}
.orc-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.orc-row:last-child{border-bottom:none}
@media(max-width:400px){.fr2{grid-template-columns:1fr}.car-grid{grid-template-columns:1fr}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
<div id="login-screen" style="display:none;position:fixed;inset:0;background:#f8f9fa;z-index:9999;display:flex;align-items:center;justify-content:center;padding:1rem">
  <div style="background:#fff;border:1px solid #e2e6ea;border-radius:14px;padding:2rem 1.75rem;width:100%;max-width:380px;box-shadow:0 4px 24px rgba(0,0,0,.08)">
    <div style="text-align:center;margin-bottom:1.75rem">
      <img id="login-logo" src="" alt="Bandeirante" style="height:48px;object-fit:contain;margin-bottom:1rem">
      <div style="font-size:13px;color:#6c757d">Carregadores Frontais — Vendas</div>
    </div>
    <div style="margin-bottom:1rem">
      <label style="display:block;font-size:11px;font-weight:700;color:#6c757d;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">E-mail</label>
      <input type="email" id="login-email" placeholder="seu@email.com" style="width:100%;font-size:14px;border:1px solid #dee2e6;border-radius:6px;padding:10px 12px;outline:none" autocomplete="email">
    </div>
    <div style="margin-bottom:1.25rem">
      <label style="display:block;font-size:11px;font-weight:700;color:#6c757d;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Senha</label>
      <div style="position:relative">
        <input type="password" id="login-senha" placeholder="••••••••" style="width:100%;font-size:14px;border:1px solid #dee2e6;border-radius:6px;padding:10px 40px 10px 12px;outline:none" autocomplete="current-password">
        <button onclick="toggleSenha()" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#6c757d;padding:0">
          <i class="ti ti-eye" id="eye-icon" style="font-size:18px"></i>
        </button>
      </div>
    </div>
    <div id="login-erro" style="display:none;background:#fff5f5;color:#dc3545;border-radius:6px;padding:.6rem .9rem;font-size:13px;margin-bottom:1rem"></div>
    <button id="login-btn" onclick="fazerLogin()" style="width:100%;background:#185FA5;color:#fff;border:none;border-radius:6px;padding:11px;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s">
      Entrar
    </button>
    <div style="text-align:center;margin-top:1rem">
      <a href="#" onclick="esqueciSenha()" style="font-size:12px;color:#185FA5;text-decoration:none">Esqueci minha senha</a>
    </div>
  </div>
</div>

async function sbReq(method, table, params, body) {
  const url = SB_URL + '/rest/v1/' + table + (params ? '?' + params : '');
  const token = localStorage.getItem('sb_token') || SB_KEY;
  const headers = {'apikey': SB_KEY, 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'};
  if (method !== 'GET' && method !== 'DELETE') headers['Prefer'] = 'return=representation';
  const opts = {method, headers};
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(url, opts);
  if (method === 'DELETE') return;
  return r.json();
}

function fmt(v){return v===0?'—':'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function iniciais(n){if(!n)return '?';const p=n.trim().split(/\s+/);return p.length>=2?(p[0][0]+p[p.length-1][0]).toUpperCase():n.slice(0,2).toUpperCase();}
function genNum(){return 'ORC-'+Date.now().toString().slice(-6);}
function toast(msg,dur=2500){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),dur);}
function g(id){return (document.getElementById(id)||{}).value||'';}

function gerarPDFRasthor(rid){
  const r=RASTHOR.find(x=>x.id===rid);
  if(!r)return;
  const gr=id=>( document.getElementById(id)||{} ).value||'';
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const W=doc.internal.pageSize.getWidth();
  const M=14;
  const num='ORC-'+Date.now().toString().slice(-6);
  const hoje=new Date().toLocaleDateString('pt-BR');
  const nParc=parseInt(gr('rc-pgto'));
  const totalFinal=(!isNaN(nParc)&&nParc>1)?r.preco*(1+nParc*0.01):r.preco;

  let y=M;

  // Logo
  try{
    const logoEl=document.querySelector('.app-header img');
    if(logoEl) doc.addImage(logoEl.src,'PNG',M,y,45,14);
  }catch(e){}

  // Cabeçalho empresa
  doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(30);
  doc.text('BANDEIRANTE IND. E COMERCIO DE MAQUINAS LTDA',W/2,y+4,{align:'center'});
  doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(80);
  doc.text('CNPJ: 87.605.374/0001-19',W/2,y+8,{align:'center'});
  doc.text('E-mail: vendas@bandeirantemaquinas.com.br  |  Telefone: 54 2104-2844',W/2,y+12,{align:'center'});
  doc.text('www.bandeirantemaquinas.com.br',W/2,y+16,{align:'center'});
  y+=20;

  doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(30);
  doc.text('Orçamento Nº '+num,W/2,y+2,{align:'center'});
  y+=6;
  doc.setDrawColor(180);doc.setLineWidth(0.4);doc.line(M,y,W-M,y);y+=4;

  // Dados cliente
  const nome=(gr('rc-nome')||'').toUpperCase();
  const empresa=gr('rc-empresa');const tel=gr('rc-tel');const cidade=gr('rc-cidade');
  const pgto=gr('rc-pgto');const frete=gr('rc-frete');const obs=gr('rc-obs');
  const vendedor=gr('rc-vendedor');

  const df=(label,val,x,yw)=>{
    doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(30);
    doc.text(label+' ',x,yw);
    doc.setFont('helvetica','normal');doc.setTextColor(60);
    doc.text(val||'—',x+doc.getTextWidth(label+' '),yw);
  };
  df('Cliente:',nome,M,y);y+=5;
  if(empresa) {df('Empresa:',empresa,M,y);y+=5;}
  df('Cidade:',cidade,M,y);
  if(tel) df('Telefone:',tel,W/2,y);
  y+=5;
  doc.setDrawColor(180);doc.line(M,y,W-M,y);y+=4;

  // Categoria
  doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.setTextColor(30);
  doc.text('DESCOMPACTADORES',M,y+4);
  doc.setFillColor(240,240,240);doc.rect(M,y,W-M*2,7,'F');
  doc.text('DESCOMPACTADORES',M+2,y+4.5);
  y+=8;

  // Item
  doc.autoTable({
    head:[['#','Código','Produto','Qtde.','Subtotal']],
    body:[[
      '1', r.cod,
      r.nome.toUpperCase()+'
'+r.desc+'
FINAME '+r.finame+' · NCM 84322100
Discos 20" · Esp. '+r.esp+(r.prof!=='—'?' · Prof. '+r.prof:'')+' · Desarme '+r.desarme,
      '1',
      'R$ '+r.preco.toLocaleString('pt-BR',{minimumFractionDigits:2})
    ]],
    startY:y, margin:{left:M,right:M},
    styles:{fontSize:9,cellPadding:4},
    headStyles:{fillColor:[240,240,240],textColor:[40,40,40],fontStyle:'bold',lineWidth:0.3,lineColor:[200,200,200]},
    columnStyles:{0:{cellWidth:8},1:{cellWidth:22},2:{cellWidth:'auto'},3:{cellWidth:12,halign:'center'},4:{cellWidth:30,halign:'right',fontStyle:'bold'}},
    bodyStyles:{lineColor:[220,220,220],lineWidth:0.2},
  });

  y=doc.lastAutoTable.finalY;

  // Totais
  doc.setFillColor(240,240,240);doc.rect(M,y,W-M*2,6,'F');
  doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(40);
  doc.text('Qtde. Total:',W-M-30,y+4.5);doc.text('1',W-M-1,y+4.5,{align:'right'});y+=6;
  doc.setFillColor(230,230,230);doc.rect(M,y,W-M*2,7,'F');
  doc.setFontSize(10);doc.setTextColor(20);
  const lblTot=(!isNaN(nParc)&&nParc>1)?nParc+'x — Valor total c/ juros:':'Valor total:';
  doc.text(lblTot,W-M-55,y+5.5);
  doc.text('R$ '+totalFinal.toLocaleString('pt-BR',{minimumFractionDigits:2}),W-M-1,y+5.5,{align:'right'});
  y+=8;

  // Info rodapé
  [{label:'Condição de Pagamento:',val:pgto||'—'},{label:'Transportadora / Frete:',val:frete||'—'},{label:'Vendedor:',val:vendedor||'—'},{label:'Data de Emissão:',val:hoje}].forEach(row=>{
    doc.setFillColor(248,248,248);doc.rect(M,y,W-M*2,6,'FD');
    doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(40);
    doc.text(row.label,M+2,y+4.2);
    doc.setFont('helvetica','normal');doc.setTextColor(60);
    doc.text(row.val,M+55,y+4.2);y+=6;
  });

  if(obs){
    const obsLines=doc.splitTextToSize('Informações Adicionais:
'+obs,W-M*2-6);
    doc.setFillColor(248,248,248);doc.rect(M,y,W-M*2,obsLines.length*4+4,'FD');
    doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(60);
    doc.text(obsLines,M+2,y+4);y+=obsLines.length*4+6;
  }

  y+=2;
  doc.setFontSize(7);doc.setTextColor(150);
  const nota='Havendo oscilação positiva em valores das commodities, aço e importados, este pedido pode estar sujeito à reajuste. Validade do orçamento de 10 dias. A estimativa de entrega do seu pedido pode variar de 30 à 60 dias (não havendo demandas de engenharia).';
  const notaL=doc.splitTextToSize(nota,W-M*2);
  doc.text(notaL,W/2,y,{align:'center'});y+=notaL.length*3.5+8;

  doc.setDrawColor(160);doc.setLineWidth(0.3);
  const c3=(W-M*2)/3;
  doc.line(M,y,M+c3-4,y);doc.line(M+c3,y,M+c3*2-4,y);doc.line(M+c3*2,y,W-M,y);
  doc.setFontSize(8);doc.setTextColor(100);
  doc.text('Data:  ___/___/______',M,y+4);
  doc.text('Assinatura do cliente',M+c3,y+4);
  doc.text('Vendedor responsável',M+c3*2,y+4);

  doc.save('orcamento-rasthor-'+num+'.pdf');
}

function renderProg(){
  document.getElementById('prog-bar').innerHTML=STEPS.map((s,i)=>{
    let cls=i<st.step?'done':i===st.step?'active':'';
    return `<div class="prog-step ${cls}" ${i<st.step?`onclick="goStep(${i})"`:''}>
      <div class="prog-dot">${i<st.step?'<i class="ti ti-check" style="font-size:10px"></i>':i+1}</div>${s}</div>`;
  }).join('');
}

  const el=document.getElementById('step-content');if(!el)return;

  el.innerHTML=fns[st.step]?fns[st.step]():'';

function calcTotal(){
  let t=0;

  const adp=ADAPTADORES.find(a=>a.id===st.adaptSel);if(adp)t+=adp.preco;
  const joy=JOYSTICKS.find(j=>j.id===st.joySel);if(joy)t+=joy.preco;
  st.implSel.forEach(id=>{const im=IMPLEMENTOS.find(x=>x.id===id);if(im)t+=im.preco;});
  return t;
}

async function salvarOrcamento(){
  const car=CARREGADORES.find(c=>c.id===st.carregadorSel);
  const adp=ADAPTADORES.find(a=>a.id===st.adaptSel);
  const joy=JOYSTICKS.find(j=>j.id===st.joySel);
  const impls=IMPLEMENTOS.filter(i=>st.implSel.includes(i.id));
  const total=calcTotal();
  const m=st.marcaSel?MARCAS.find(x=>x.id===st.marcaSel):null;
  const itens=[];
  if(car)itens.push({cod:car.cod,nome:car.nome,preco:car.preco});
  if(adp&&adp.id!=='adp_nao')itens.push({cod:adp.cod,nome:adp.nome,preco:adp.preco});
  if(joy&&joy.id!=='joy_nao')itens.push({cod:joy.cod,nome:joy.nome,preco:joy.preco});
  impls.forEach(i=>itens.push({cod:i.cod,nome:i.nome,preco:i.preco}));
  const btn=document.getElementById('btn-salvar');
  if(btn){btn.disabled=true;btn.innerHTML='<i class="ti ti-loader-2" style="animation:spin .7s linear infinite"></i> Salvando...';}
  try{
    await sbPost('orcamentos',{
      numero:'ORC-'+Date.now().toString().slice(-6),
      vendedor_id:currentUser?.id||null,
      cliente_id:st.clienteSel?.id||null,
      cliente_nome:g('cli-nome')||st.clienteSel?.nome||null,
      trator_marca:m?.label||null,trator_modelo:st.modeloSel||null,
      estrutura:car?.estrutura||null,
      adaptador_cod:st.adaptDB?.adaptador||null,
      joystick_cod:st.adaptDB?.joystick||null,
      itens,total,
      vendedor:g('cli-vendedor')||st.clienteSel?.vendedor||null,
      obs:g('cli-obs'),status:'Em aberto'
    });
    toast('Orçamento salvo! ✓');
    loadOrcamentos();
    if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-circle-check"></i> Salvo!';}
  }catch(e){toast('Erro ao salvar.');if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-device-floppy"></i> Salvar';}}
}

function gerarPDF(){
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const W = doc.internal.pageSize.getWidth();
  const M = 14; // margem

  // Dados do orçamento
  const car=CARREGADORES.find(c=>c.id===st.carregadorSel);
  const adp=ADAPTADORES.find(a=>a.id===st.adaptSel);
  const joy=JOYSTICKS.find(j=>j.id===st.joySel);
  const impls=IMPLEMENTOS.filter(i=>st.implSel.includes(i.id));
  const total=calcTotal();
  const m=st.marcaSel?MARCAS.find(x=>x.id===st.marcaSel):null;
  const num='ORC-'+Date.now().toString().slice(-6);
  const hoje=new Date().toLocaleDateString('pt-BR');
  const nomeCliente=(g('cli-nome')||st.clienteSel?.nome||'').toUpperCase();
  const vendedor=g('cli-vendedor')||st.clienteSel?.vendedor||'—';
  const cidade=g('cli-cidade')||st.clienteSel?.cidade||'';
  const tel=g('cli-tel')||st.clienteSel?.tel||'';
  const empresa=g('cli-empresa')||st.clienteSel?.empresa||'';
  const cpf=st.clienteSel?.cpfcnpj||'';
  const ie=st.clienteSel?.ie||'';
  const rua=st.clienteSel?.rua||'';
  const cep=st.clienteSel?.cep||'';
  const pgto=g('cli-pgto')||'';
  const frete=g('cli-frete')||'';
  const obs=g('cli-obs')||'';

  // Calcular total com juros
  const nParc=parseInt(pgto);
  const totalFinal=(!isNaN(nParc)&&nParc>1)?total*(1+nParc*0.01):total;

  // Montar itens
  const itens=[];
  if(car) itens.push({cod:car.cod,nome:car.nome+' Autonivelante',finame:car.desc||'',preco:car.preco,img:'hexline'});
  if(adp&&adp.id!=='adp_nao') itens.push({cod:adp.cod,nome:adp.nome,finame:'',preco:adp.preco,img:'adaptador'});
  if(joy&&joy.id!=='joy_nao') itens.push({cod:joy.cod,nome:joy.nome,finame:joy.desc||'',preco:joy.preco,img:'joystick'});
  impls.forEach(i=>itens.push({cod:i.cod,nome:i.nome,finame:'',preco:i.preco,img:i.img||null}));

  let y = M;

  // ── CABEÇALHO ──
  // Logo
  try{
    const logoEl=document.querySelector('.app-header img');
    if(logoEl) doc.addImage(logoEl.src,'PNG', M, y, 45, 14);
  }catch(e){}

  // Dados da empresa (centro)
  doc.setFont('helvetica','bold');
  doc.setFontSize(9);
  doc.setTextColor(30);
  doc.text('BANDEIRANTE IND. E COMERCIO DE MAQUINAS LTDA', W/2, y+4, {align:'center'});
  doc.setFont('helvetica','normal');
  doc.setFontSize(8);
  doc.setTextColor(80);
  doc.text('CNPJ: 87.605.374/0001-19', W/2, y+8, {align:'center'});
  doc.text('E-mail: vendas@bandeirantemaquinas.com.br  |  Telefone: 54 2104-2844', W/2, y+12, {align:'center'});
  doc.text('www.bandeirantemaquinas.com.br', W/2, y+16, {align:'center'});

  // Número do orçamento (centro abaixo)
  y += 20;
  doc.setFont('helvetica','bold');
  doc.setFontSize(11);
  doc.setTextColor(30);
  doc.text('Orçamento Nº '+num, W/2, y+2, {align:'center'});
  y += 6;

  // Linha separadora
  doc.setDrawColor(180);
  doc.setLineWidth(0.4);
  doc.line(M, y, W-M, y);
  y += 4;

  // ── DADOS DO CLIENTE ──
  const drawField = (label, value, x, yw, maxW) => {
    doc.setFont('helvetica','bold');
    doc.setFontSize(8);
    doc.setTextColor(30);
    doc.text(label+' ', x, yw);
    doc.setFont('helvetica','normal');
    doc.setTextColor(60);
    const lw = doc.getTextWidth(label+' ');
    doc.text(value||'—', x+lw, yw);
  };

  drawField('Cliente:', nomeCliente, M, y);
  drawField('Nome Fantasia:', empresa||nomeCliente, W/2, y);
  y += 5;
  if(cpf) { drawField('CPF/CNPJ:', cpf, M, y); }
  if(ie) { drawField('Inscrição Estadual:', ie, W/2, y); }
  y += 5;
  if(rua) { drawField('Endereço:', rua.toUpperCase(), M, y); y+=5; }
  const cidadeEstado = cidade ? cidade.toUpperCase() : '';
  drawField('Cidade:', cidadeEstado, M, y);
  if(cep) drawField('CEP:', cep, W/2, y);
  y += 5;
  if(tel) drawField('Telefone:', tel, M, y);
  y += 3;

  // Linha
  doc.setDrawColor(180);
  doc.line(M, y, W-M, y);
  y += 4;

  // ── TABELA DE ITENS ──
  const colW = {num:8, cod:22, img:16, nome:W-M*2-8-22-16-26, val:26};
  const hRow = 7;

  // Cabeçalho tabela
  doc.setFillColor(240,240,240);
  doc.rect(M, y, W-M*2, hRow, 'F');
  doc.setDrawColor(180);
  doc.setLineWidth(0.3);
  doc.rect(M, y, W-M*2, hRow, 'S');

  doc.setFont('helvetica','bold');
  doc.setFontSize(8);
  doc.setTextColor(40);
  let cx = M+1;
  doc.text('#', cx+2, y+5);                     cx+=colW.num;
  doc.text('Código', cx+1, y+5);                cx+=colW.cod;
  doc.text('Produto', cx+colW.img+1, y+5);      cx+=colW.img+colW.nome;
  doc.text('Qtde.', cx+1, y+5);
  doc.text('Subtotal', W-M-1, y+5, {align:'right'});
  y += hRow;

  // Itens
  itens.forEach((it, idx) => {
    const rh = 18;
    doc.setDrawColor(200);
    doc.setLineWidth(0.2);
    doc.rect(M, y, W-M*2, rh, 'S');

    cx = M+1;
    doc.setFont('helvetica','normal');
    doc.setFontSize(8);
    doc.setTextColor(60);
    doc.text(String(idx+1), cx+2, y+8); cx+=colW.num;

    doc.setFont('helvetica','normal');
    doc.setFontSize(7);
    doc.setTextColor(80);
    doc.text(it.cod||'', cx+1, y+8); cx+=colW.cod;

    // Imagem
    try{
      if(it.img && IMGS[it.img]){
        doc.addImage(IMGS[it.img],'PNG', cx, y+1, 14, 14);
      }
    }catch(e){}
    cx+=colW.img;

    // Nome do produto
    doc.setFont('helvetica','bold');
    doc.setFontSize(8.5);
    doc.setTextColor(30);
    const nomeLines = doc.splitTextToSize(it.nome.toUpperCase(), colW.nome-2);
    doc.text(nomeLines, cx+1, y+6);
    if(it.finame){
      doc.setFont('helvetica','normal');
      doc.setFontSize(7);
      doc.setTextColor(120);
      doc.text(it.finame, cx+1, y+6+nomeLines.length*4);
    }

    // Qtde e valor
    doc.setFont('helvetica','normal');
    doc.setFontSize(8);
    doc.setTextColor(60);
    doc.text('1', W-M-26+5, y+8, {align:'center'});
    doc.setFont('helvetica','bold');
    doc.setFontSize(8.5);
    doc.setTextColor(30);
    doc.text('R$ '+it.preco.toLocaleString('pt-BR',{minimumFractionDigits:2}), W-M-1, y+8, {align:'right'});

    y += rh;
  });

  // ── TOTAIS ──
  doc.setDrawColor(150);
  doc.setLineWidth(0.3);

  // Linha qtde total
  doc.setFillColor(245,245,245);
  doc.rect(M, y, W-M*2, 6, 'FD');
  doc.setFont('helvetica','bold');
  doc.setFontSize(8);
  doc.setTextColor(40);
  doc.text('Qtde. Total:', W-M-30, y+4.5);
  doc.text(String(itens.length), W-M-1, y+4.5, {align:'right'});
  y+=6;

  // Valor total
  doc.setFillColor(235,235,235);
  doc.rect(M, y, W-M*2, 7, 'FD');
  doc.setFont('helvetica','bold');
  doc.setFontSize(10);
  doc.setTextColor(20);
  const labelTot = (!isNaN(nParc)&&nParc>1) ? nParc+'x — Valor total c/ juros:' : 'Valor total:';
  doc.text(labelTot, W-M-50, y+5.5);
  doc.text('R$ '+totalFinal.toLocaleString('pt-BR',{minimumFractionDigits:2}), W-M-1, y+5.5, {align:'right'});
  if(!isNaN(nParc)&&nParc>1){
    doc.setFontSize(7.5);
    doc.setTextColor(100);
    doc.text('À vista: R$ '+total.toLocaleString('pt-BR',{minimumFractionDigits:2}), W-M-1, y+10, {align:'right'});
    y+=4;
  }
  y+=8;

  // ── RODAPÉ INFO ──
  const infoRows = [];
  if(pgto) infoRows.push({label:'Condição de Pagamento:', val:pgto});
  if(frete) infoRows.push({label:'Transportadora / Frete:', val:frete});
  if(m&&st.modeloSel){
    infoRows.push({label:'Marca:', val:m.label});
    infoRows.push({label:'Modelo:', val:st.modeloSel});
  }
  infoRows.push({label:'Vendedor:', val:vendedor});
  infoRows.push({label:'Data de Emissão:', val:hoje});

  infoRows.forEach(row => {
    doc.setFillColor(248,248,248);
    doc.rect(M, y, W-M*2, 6, 'FD');
    doc.setFont('helvetica','bold');
    doc.setFontSize(8);
    doc.setTextColor(40);
    doc.text(row.label, M+2, y+4.2);
    doc.setFont('helvetica','normal');
    doc.setTextColor(60);
    doc.text(row.val, M+55, y+4.2);
    y+=6;
  });

  // Observações
  if(obs){
    doc.setFillColor(248,248,248);
    const obsLines = doc.splitTextToSize('Observações: '+obs, W-M*2-6);
    doc.rect(M, y, W-M*2, obsLines.length*4+4, 'FD');
    doc.setFont('helvetica','normal');
    doc.setFontSize(7.5);
    doc.setTextColor(60);
    doc.text(obsLines, M+2, y+4);
    y += obsLines.length*4+5;
  }

  // Nota padrão
  y+=2;
  doc.setFontSize(7);
  doc.setTextColor(140);
  const nota = 'Havendo oscilação positiva em valores das commodities, aço e importados, este pedido pode estar sujeito à reajuste. Validade do orçamento de 10 dias. A estimativa de entrega do seu pedido pode variar de 30 à 60 dias (não havendo demandas de engenharia).';
  const notaLines = doc.splitTextToSize(nota, W-M*2);
  doc.text(notaLines, W/2, y, {align:'center'});
  y += notaLines.length*3.5+6;

  // Assinatura
  doc.setDrawColor(160);
  doc.setLineWidth(0.3);
  const col3 = (W-M*2)/3;
  doc.line(M, y, M+col3-4, y);
  doc.line(M+col3, y, M+col3*2-4, y);
  doc.line(M+col3*2, y, W-M, y);
  doc.setFont('helvetica','normal');
  doc.setFontSize(8);
  doc.setTextColor(100);
  doc.text('Data:  ___/___/______', M, y+4);
  doc.text('Assinatura do cliente', M+col3, y+4);
  doc.text('Vendedor responsável', M+col3*2, y+4);

  // Salvar
  doc.save('orcamento-'+num+'.pdf');
}

function filtrarCliMain(){
  const q=(document.getElementById('busca-cli-main')?.value||'').toLowerCase();
  const res=clientes.filter(c=>!q||c.nome?.toLowerCase().includes(q)||c.empresa?.toLowerCase().includes(q)||c.cidade?.toLowerCase().includes(q)||c.cpfcnpj?.includes(q));
  const el=document.getElementById('lista-cli-main');if(!el)return;
  if(!res.length){
    el.innerHTML=`<div class="empty"><i class="ti ti-users"></i><div style="font-weight:600">${clientes.length===0?'Nenhum cliente cadastrado':'Nenhum resultado'}</div></div>`;
    return;
  }
  el.innerHTML=res.map(c=>`
    <div class="cli-card" onclick="verDetalheCliente('${c.id}')">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
        <div style="display:flex;align-items:center;gap:10px;min-width:0">
          <div class="cli-avatar">${iniciais(c.nome)}</div>
          <div style="min-width:0">
            <div style="font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.nome}</div>
            <div style="font-size:12px;color:var(--text2)">${[c.empresa,c.cidade+(c.estado?'/'+c.estado:'')].filter(Boolean).join(' · ')}</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
          ${c.tipo?`<span class="badge badge-green">${c.tipo}</span>`:''}
          <i class="ti ti-chevron-right" style="color:var(--text3)"></i>
        </div>
      </div>
    </div>`).join('');
}

async function salvarCliente(id){
  const nome=g('f-nome').trim();
  if(!nome){const e=document.getElementById('f-erro');e.textContent='Nome é obrigatório.';e.style.display='block';return;}
  const body={nome,empresa:g('f-empresa'),cpfcnpj:g('f-cpfcnpj'),ie:g('f-ie'),tel:g('f-tel'),email:g('f-email'),
    rua:g('f-rua'),bairro:g('f-bairro'),cidade:g('f-cidade'),estado:g('f-estado').toUpperCase(),
    cep:g('f-cep'),tipo:g('f-tipo'),vendedor:g('f-vendedor'),obs:g('f-obs')};
  try{
    if(id&&id!=='null'){await sbReq('PATCH','clientes','id=eq.'+id,body);}
    else{await sbReq('POST','clientes','',body);}
    toast(id&&id!=='null'?'Cliente atualizado! ✓':'Cliente cadastrado! ✓');
    await loadClientes();showTab('clientes');
  }catch(e){toast('Erro ao salvar.');}
}

async function excluirCliente(id){
  if(!confirm('Excluir este cliente?'))return;
  await sbReq('DELETE','clientes','id=eq.'+id,null);
  toast('Cliente excluído.');
  await loadClientes();showTab('clientes');
}

// ---- HISTÓRICO ----
async function loadOrcamentos(){
  try{
    const isAdmin=currentPerfil?.role==='admin';
    const filter=isAdmin?'order=criado_em.desc&limit=200':'vendedor_id=eq.'+(currentUser?.id||'')+'&order=criado_em.desc&limit=100';
    orcamentos=await sbGet('orcamentos',filter);
    if(!Array.isArray(orcamentos))orcamentos=[];
  }catch(e){orcamentos=[];}
}

function renderHistorico(){
  document.getElementById('app-content').innerHTML=`
  <div class="page-wrap">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:8px">
      <div>
        <div style="font-size:16px;font-weight:700">Histórico</div>
        <div style="font-size:12px;color:var(--text2)" id="hist-count">${orcamentos.length} orçamento${orcamentos.length!==1?'s':''}</div>
      </div>
      <button class="btn btn-sm" onclick="loadOrcamentos().then(()=>filtrarHistorico())"><i class="ti ti-refresh"></i> Atualizar</button>
    </div>
    <div class="ig" style="margin-bottom:.75rem">
      <input type="text" id="busca-hist" oninput="filtrarHistorico()" placeholder="Buscar por cliente, trator, produto, ORC-...">
    </div>
    <div id="lista-hist"></div>
  </div>`;
  filtrarHistorico();
}

function filtrarHistorico(){
  const q=(document.getElementById('busca-hist')?.value||'').toLowerCase().trim();
  const res = q ? orcamentos.filter(o=>{
    // Buscar em número
    if((o.numero||'').toLowerCase().includes(q)) return true;
    // Buscar em cliente
    if((o.cliente_nome||'').toLowerCase().includes(q)) return true;
    // Buscar em vendedor
    if((o.vendedor||'').toLowerCase().includes(q)) return true;
    // Buscar em trator
    if((o.trator_marca||'').toLowerCase().includes(q)) return true;
    if((o.trator_modelo||'').toLowerCase().includes(q)) return true;
    // Buscar nos itens (nome e código)
    if(Array.isArray(o.itens)){
      return o.itens.some(i=>
        (i.nome||'').toLowerCase().includes(q)||
        (i.cod||'').toLowerCase().includes(q)
      );
    }
    return false;
  }) : orcamentos;

  // Atualizar contador
  const countEl=document.getElementById('hist-count');
  if(countEl) countEl.textContent=q?`${res.length} de ${orcamentos.length} orçamentos`:`${orcamentos.length} orçamento${orcamentos.length!==1?'s':''}`;

  const el=document.getElementById('lista-hist');
  if(!el) return;

  if(orcamentos.length===0){
    el.innerHTML=`<div class="empty"><i class="ti ti-receipt"></i><div style="font-weight:600">Nenhum orçamento salvo</div><div style="font-size:13px">Gere e salve um orçamento para aparecer aqui</div></div>`;
    return;
  }
  if(res.length===0){
    el.innerHTML=`<div class="empty"><i class="ti ti-search"></i><div style="font-weight:600">Nenhum resultado</div><div style="font-size:13px">Tente buscar por cliente, trator ou produto</div></div>`;
    return;
  }

  el.innerHTML=res.map(o=>{
    const itensNomes=Array.isArray(o.itens)?o.itens.map(i=>i.nome).join(', '):'';
    const q2=(document.getElementById('busca-hist')?.value||'').toLowerCase();
    // Destacar match nos itens se a busca bater num item
    const itemMatch=q2&&Array.isArray(o.itens)?o.itens.find(i=>(i.nome||'').toLowerCase().includes(q2)||(i.cod||'').toLowerCase().includes(q2)):null;
    return `<div class="orc-card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.5rem">
        <div style="min-width:0">
          <div style="font-size:14px;font-weight:700">${o.numero||'—'}</div>
          <div style="font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${o.cliente_nome||'—'} · ${o.vendedor||'—'}</div>
        </div>
        <div style="text-align:right;flex-shrink:0;margin-left:10px">
          <div style="font-size:16px;font-weight:700">R$ ${Number(o.total||0).toLocaleString('pt-BR',{minimumFractionDigits:2})}</div>
          <span class="badge badge-green" style="font-size:11px">${o.status||'Em aberto'}</span>
        </div>
      </div>
      ${o.trator_marca&&o.trator_modelo?`<div style="font-size:12px;color:var(--text2);margin-bottom:3px"><i class="ti ti-tractor" style="font-size:13px"></i> ${o.trator_marca} · ${o.trator_modelo}</div>`:''}
      ${itensNomes?`<div style="font-size:11px;color:var(--text2);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${itensNomes}"><i class="ti ti-package" style="font-size:12px"></i> ${itensNomes}</div>`:''}
      ${itemMatch?`<div style="font-size:11px;background:var(--blue-light);color:var(--blue-dark);border-radius:4px;padding:2px 8px;display:inline-block;margin-bottom:3px"><i class="ti ti-search" style="font-size:11px"></i> ${itemMatch.nome}</div>`:''}
      <div style="font-size:11px;color:var(--text3)">${new Date(o.criado_em).toLocaleDateString('pt-BR')} ${new Date(o.criado_em).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</div>
    </div>`;
  }).join('');
}
